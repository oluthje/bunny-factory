# Solid Queue config for the lightweight stack, passed to bin/jobs with -c and run with
# --mode=async, so the supervisor, dispatcher, scheduler and worker share ONE Ruby process
# (the standard stack forks five, roughly 1 GB).
#
# One worker thread for every queue. That keeps api/config/queue.yml's one-job-at-a-time
# behaviour, which matters because the app isn't known to be thread-safe. The cost: a chat
# turn can wait behind a running batch job. "chat" is listed first, so it still goes ahead
# of anything that is only queued.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ chat, default, solid_queue_recurring ]
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default
